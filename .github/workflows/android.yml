name: Android APK Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build APK with Full Log
        run: |
          flutter clean
          flutter pub get
          flutter doctor -v
          flutter build apk --release --verbose > build_log.txt 2>&1 || true

      - name: Show Failure Details
        if: always()
        run: |
          echo "========== FAILURE =========="
          grep -n "FAILURE:" build_log.txt || true
          
          echo "========== EXCEPTION =========="
          grep -n "Exception" build_log.txt || true
          
          echo "========== CAUSED BY =========="
          grep -n "Caused by:" build_log.txt || true
          
          echo "========== ERROR =========="
          grep -n "error:" build_log.txt || true
          
          echo "========== LAST 200 LINES =========="
          tail -n 200 build_log.txt

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NF-Sports-APK
          path: android/app/build/outputs/**/*.apk
