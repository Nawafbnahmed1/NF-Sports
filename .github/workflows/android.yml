name: Android APK Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ☕ 1. تثبيت واستقرار بيئة جافا الرسمية JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 🎯 2. إعداد وتثبيت محرك الـ Android SDK وأدوات التجميع الرسمية بالسيرفر
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 🚀 3. تثبيت محرك فلاتر المستقر
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # 🔍 4. الخطوات التشخيصية المتقدمة والمحدثة بناءً على طلب المساعد الحاسم
      - name: Verify Generated Android Config & Flutter Version
        run: |
          echo "===== 1. Verifying actual file contents at build time ====="
          cat android/app/build.gradle.kts || true
          
          echo "===== 2. Checking Flutter Doctor & Version ====="
          flutter --version || true
          flutter doctor -v || true

      # ⚙️ 5. طحن الملفات وإطلاق التجميع وضخ البيانات لملف سجل الفحص
      - name: Build APK with Full Log
        run: |
          flutter clean
          flutter pub get
          flutter pub upgrade --major-versions || true
          flutter pub upgrade || true
          
          # 🛡️ حقن وقبول الرخص للأدوات الجديدة بعد الـ pub لمنع الحظر الأمني
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n8945a9b465d4cd44745d177af6122553d4d74a45\n24333f1a63b6b82d491a6342b723c300329884ba\ncd10d595b161d47148b77922724ec262002e1a4a\n3383895b62b1b367d79a2c151d6156d0d97f7d43\n2f8c0aab27545014e51e304206059fc00a317581\n35db2d02b115b2de370a803a085ee4e16a2167a1\n6c1d056516350449e924e0e1e7f24446a82a6f7e" > "$ANDROID_HOME/licenses/android-sdk-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          yes | flutter doctor --android-licenses || true
          
          # 🏗️ التجميع الفعلي النقي مع استخراج السجل الشامل
          flutter build apk --release --verbose > build_log.txt 2>&1

      # 📊 6. طباعة أول 60 سطراً لتعارض الـ AAR المباشر من قلب السجل بناءً على طلب صديقك الأخير
      - name: Print Deep AAR Errors and Metadata Details
        if: always()
        run: |
          echo "========== START DEEP AAR ERRORS =========="
          grep -n -A 60 "issues were found when checking AAR metadata" build_log.txt || true
          grep -n -A 60 "compiled against android-" build_log.txt || true
          echo "========== END DEEP AAR ERRORS =========="

      # لوحة تفاصيل الأخطاء العامة الاحتياطية بالسيرفر
      - name: Show Failure Details
        if: failure()
        run: |
          echo "========== LAST 200 LINES =========="
          tail -n 200 build_log.txt || true
