name: Android APK Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Production Keystore & Properties
        run: |
          keytool -genkeypair -v \
            -keystore android/upload-keystore.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias upload \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -dname "CN=Nawaf, O=NFSports, C=SA"

          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - name: Prepare Flutter Project
        run: |
          flutter pub get
          flutter clean
          flutter pub get

      - name: Generate App Icons
        run: |
          flutter pub run flutter_launcher_icons

      - name: Create Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.13 --distribution-type all
          chmod +x gradlew

      - name: Verify Gradle Version
        run: |
          cd android
          ./gradlew --version

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NF-Sports-Release-APK
          path: |
            android/app/build/outputs/apk/release/*.apk
            build/app/outputs/flutter-apk/*.apk
