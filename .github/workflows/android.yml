name: Android APK Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ☕ تثبيت بيئة جافا المتوافقة بالملي مع إصدارات الـ Gradle والـ AGP المحدثة في مشروعك
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # 🛡️ حقن الموافقة الإجبارية والأوتوماتيكية على رخص الأندرويد لحل تعارض السيرفر وحظر الـ APK كلياً
      - name: Accept Android Licenses
        run: |
          yes | flutter doctor --android-licenses

      # ⚙️ تنظيف وحقن وبناء الـ APK الحقيقي بنقاء صارم واستخراج المخرجات
      - name: Build APK with Full Log
        run: |
          flutter clean
          flutter pub get
          flutter doctor -v
          flutter build apk --release --verbose > build_log.txt 2>&1

      # 📊 لوحة استكشاف الأخطاء؛ تشتغل تلقائياً فقط في حال حدوث أي فشل حقيقي بالبناء
      - name: Show Failure Details
        if: failure()
        run: |
          echo "========== FAILURE =========="
          grep -n "FAILURE:" build_log.txt || true
          
          echo "========== EXCEPTION =========="
          grep -n "Exception" build_log.txt || true
          
          echo "========== CAUSED BY =========="
          grep -n "Caused by:" build_log.txt || true
          
          echo "========== ERROR =========="
          grep -n "error:" build_log.txt || true
          
          echo "========== LAST 200 LINES =========="
          tail -n 200 build_log.txt

      # 📥 محرك الرفع الرسمي المحدث بالالمسار الافتراضي الثابت والآمن لإعادة سهم التحميل فوراً
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NF-Sports-APK
          path: build/app/outputs/flutter-apk/app-release.apk
