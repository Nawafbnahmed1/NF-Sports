name: Android APK Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ☕ 1. تثبيت واستقرار بيئة جافا الرسمية JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 🎯 2. إعداد وتثبيت محرك الـ Android SDK وأدوات التجميع الرسمية بالسيرفر
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 🚀 3. تثبيت محرك فلاتر المستقر
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # ⚙️ 4. حقن وتثبيت إصدار الـ Gradle Wrapper المستقر المتوافق مع AGP 8.9.1 بناءً على خطة الصديق
      - name: Force Gradle Wrapper Version
        run: |
          mkdir -p android/gradle/wrapper
          echo "distributionBase=GRADLE_USER_HOME" > android/gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "===== Verified Gradle Wrapper Properties ====="
          cat android/gradle/wrapper/gradle-wrapper.properties

      # 🔍 5. الخطوات التشخيصية المتقدمة لمراقبة توافق البيئة
      - name: Verify Generated Android Config & Flutter Version
        run: |
          echo "===== Verifying build.gradle.kts contents ====="
          cat android/app/build.gradle.kts || true
          flutter --version || true

      # 🏗️ 6. طحن الأكواد وتجميع الـ APK بنقاء تكتيكي مطلق
      - name: Build APK with Full Log
        run: |
          flutter clean
          flutter pub get
          flutter pub upgrade --major-versions || true
          flutter pub upgrade || true
          
          # 🛡️ تفعيل وقبول الرخص للأدوات الجديدة بعد الـ pub لمنع الحظر الأمني
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n8945a9b465d4cd44745d177af6122553d4d74a45\n24333f1a63b6b82d491a6342b723c300329884ba\ncd10d595b161d47148b77922724ec262002e1a4a\n3383895b62b1b367d79a2c151d6156d0d97f7d43\n2f8c0aab27545014e51e304206059fc00a317581\n35db2d02b115b2de370a803a085ee4e16a2167a1\n6c1d056516350449e924e0e1e7f24446a82a6f7e" > "$ANDROID_HOME/licenses/android-sdk-license"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          yes | flutter doctor --android-licenses || true
          
          # إطلاق البناء الفعلي النظيف وحفظ السجلات
          flutter build apk --release --verbose > build_log.txt 2>&1

      # 📊 7. طباعة الأسطر للـ AAR للتحقق الصارم من انقشاع المشكلة
      - name: Print Deep AAR Errors and Metadata Details
        if: always()
        run: |
          echo "========== START DEEP AAR ERRORS =========="
          grep -n -A 60 "issues were found when checking AAR metadata" build_log.txt || true
          grep -n -A 60 "compiled against android-" build_log.txt || true
          echo "========== END DEEP AAR ERRORS =========="

      # لوحة المخرجات؛ تفتح تلقائياً وتوفر سهم التحميل الملكي فور النجاح
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NF-Sports-APK
          path: build/app/outputs/flutter-apk/app-release.apk
