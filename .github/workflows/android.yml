name: Android APK Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --verbose

      - name: Show all build files
        if: always()
        run: |
          echo "==== BUILD ===="
          find build -type f || true
          echo "==== APK ===="
          find . -name "*.apk" || true
          echo "==== AAB ===="
          find . -name "*.aab" || true
          echo "==== OUTPUTS ===="
          ls -R build/app/outputs || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NF-Sports-APK
          path: build/app/outputs/**/*.apk
