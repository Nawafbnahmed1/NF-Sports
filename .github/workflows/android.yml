name: Android APK Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Force Gradle Wrapper & Properties Version
        run: |
          mkdir -p android/gradle/wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          EOF

          cat >> android/gradle.properties <<'EOF'
          kotlin.incremental=false
          kotlin.compiler.execution.strategy=in-process
          org.gradle.kotlin.dsl.precompiled.accessors=false
          EOF

      - name: Build APK
        run: |
          set -o pipefail
          flutter clean
          flutter pub get
          flutter analyze
          flutter build apk --release --verbose 2>&1 | tee build.log

      - name: Show build error
        if: always()
        run: |
          echo "===== FIRST ERROR LINES ====="
          grep -n -i -E "what went wrong|error|failed|exception|caused by" build.log | head -n 80 || true
          echo "===== LAST 200 LINES ====="
          tail -n 200 build.log || true

      - name: Show build status
        if: always()
        run: |
          echo "===== CURRENT DIR ====="
          pwd
          echo "===== ROOT FILES ====="
          ls -la
          echo "===== ANDROID FILES ====="
          ls -la android || true
          echo "===== BUILD FILES ====="
          ls -la build || true
          echo "===== APK SEARCH ====="
          find . -type f -name "*.apk" || true
          find . -type f -name "*.aab" || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NF-Sports-APK
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
          if-no-files-found: warn
