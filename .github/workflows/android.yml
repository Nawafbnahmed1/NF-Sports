name: Android APK Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ✓ 1. سحب كود المشروع الأصلي من حسابك
      - uses: actions/checkout@v4

      # ✓ 2. تثبيت محرك فلاتر الرسمي والقناة المستقرة بناءً على ترتيب المساعد
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # ☕ 3. تثبيت واستقرار بيئة جافا الرسمية JDK 17 التابعة لـ Temurin
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 🎯 4. إعداد وتثبيت محرك الـ Android SDK لتأمين وقبول الرخص تلقائياً من السحاب
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ⚙️ 5. حقن وتثبيت إصدار الـ Gradle Wrapper المستقر المتوافق مع AGP 8.9.1
      - name: Force Gradle Wrapper Version
        run: |
          mkdir -p android/gradle/wrapper
          echo "distributionBase=GRADLE_USER_HOME" > android/gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip" >> android/gradle/wrapper/gradle-wrapper.properties

      # 🏗️ 6. الطحن والتجميع الفعلي النقي والمباشر بدون أي خطوات رخص معطلة أو مجازفات
      - name: Flutter Pub Get & Build APK
        run: |
          flutter clean
          flutter pub get
          flutter pub upgrade --major-versions || true
          flutter pub upgrade || true
          
          # إطلاق البناء الفعلي النظيف للـ Release وحفظ السجلات الصامتة للتحقق
          flutter build apk --release --verbose > build_log.txt 2>&1

      # 📊 7. الأداة الاستكشافية الحصرية لطباعة آخر 50 سطراً بعد البناء فقط إذا فشل (بناءً على طلب المساعد)
      - name: Print Last 50 Lines on Failure
        if: failure()
        run: |
          echo "========== START FAILURE REPORT (LAST 50 LINES) =========="
          tail -n 50 build_log.txt || true
          echo "========== END FAILURE REPORT =========="

      # 📥 8. محرك الرفع الرسمي المحدث والآمن لإعادة سهم التحميل الملكي فور النجاح
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NF-Sports-APK
          path: build/app/outputs/flutter-apk/app-release.apk
