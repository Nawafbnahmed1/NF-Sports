name: Android APK Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Production Keystore & Properties
        run: |
          # 🔐 تم تصحيح المسار بحذف /app ليتطابق موضع المفتاح مع ملف التجميع للأندرويد
          keytool -genkeypair -v -keystore android/upload-keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -keypass "${{ secrets.KEYSTORE_PASSWORD }}" -dname "CN=Nawaf, O=NFSports, C=SA"
          
          # 📝 إنشاء ملف الخصائص السري لربط المفتاح أثناء التجميع بسلام
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOF

      - name: Build APK
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NF-Sports-Release-APK
          path: build/app/outputs/flutter-apk/*-release.apk
