name: Android APK Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.0'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Flutter dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            build/
          key: ${{ runner.os }}-flutter-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Get dependencies
        run: |
          flutter pub get

      - name: Build APK (with error handling)
        id: build_apk
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log
          # Check if build succeeded
          if [ $? -ne 0 ]; then
            echo "❌ Build failed! Extracting errors..."
            grep -n -i -E "what went wrong|error|failed|exception|caused by|FAILURE|BUILD FAILED" build.log | head -50
            exit 1
          fi

      - name: Show only errors if build failed
        if: failure()
        run: |
          echo "🚨 BUILD FAILED - Showing only errors:"
          echo "========================================="
          echo ""
          echo "🔴 First 50 error lines:"
          grep -n -i -E "what went wrong|error|failed|exception|caused by|FAILURE|BUILD FAILED|Could not|Unable to|Unsupported" build.log | head -50
          echo ""
          echo "========================================="
          echo "📌 Last 100 lines of build log:"
          tail -100 build.log
          echo ""
          echo "========================================="
          echo "📁 Checking if APK was generated:"
          find . -type f -name "*.apk" || echo "❌ No APK found"
          echo ""
          echo "📁 Checking build directory:"
          ls -la build/ 2>/dev/null || echo "❌ Build directory not found"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NF-Sports-APK
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          retention-days: 7
